<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" fill="currentColor">
  <!-- Bugcrowd Shield/Bug Logo -->
  <defs>
    <linearGradient id="bugGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Shield background -->
  <path d="M32 4 L48 12 L48 32 Q48 48 32 56 Q16 48 16 32 L16 12 Z" fill="url(#bugGradient)" opacity="0.9"/>
  
  <!-- Bug/checkmark center -->
  <g transform="translate(32, 28)">
    <!-- Left antenna -->
    <line x1="-8" y1="-12" x2="-12" y2="-16" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <!-- Right antenna -->
    <line x1="8" y1="-12" x2="12" y2="-16" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <!-- Body -->
    <circle cx="0" cy="0" r="6" fill="white"/>
    <!-- Legs -->
    <line x1="-5" y1="6" x2="-8" y2="12" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <line x1="5" y1="6" x2="8" y2="12" stroke="white" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>